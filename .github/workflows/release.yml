name: Release

on:
  # Run from the Actions tab: picks the next version, tags it, and releases it.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
  # Or push a tag yourself (e.g. v1.2.0) to release exactly that version.
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    # Manual runs only from master, so releases can't be cut from a feature branch.
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need the existing tags to compute the next version

      - name: Work out version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              version="1.0.0" # first release
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="${major}.$((minor + 1)).0" ;;
                *)     version="${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
          fi
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -Drevision=${{ steps.version.outputs.version }} package

      - uses: actions/upload-artifact@v6
        with:
          name: Fhulkers-${{ steps.version.outputs.version }}
          path: target/Fhulkers-${{ steps.version.outputs.version }}.jar

      - name: Create release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(--title "Fhulkers $VERSION" --generate-notes)
          # A pushed tag already exists; for manual runs this creates it at this commit.
          [ "$GITHUB_REF_TYPE" = "tag" ] || args+=(--target "$GITHUB_SHA")
          gh release create "v$VERSION" "target/Fhulkers-$VERSION.jar" "${args[@]}"

      # Hangar has no "re-run just this step": if this fails, the GitHub release above
      # already exists, so upload that jar to Hangar by hand instead of re-running the workflow.
      - name: Publish to Hangar
        env:
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          # Override in Settings -> Secrets and variables -> Actions -> Variables if these differ.
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'Fhulkers' }}
          HANGAR_CHANNEL: ${{ vars.HANGAR_CHANNEL || 'Release' }}
          # Paper versions this build is tested on. Must be versions Hangar knows about.
          PAPER_VERSIONS: '["26.2"]'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$HANGAR_API_KEY" ]; then
            echo "::notice::HANGAR_API_KEY is not set; skipping the Hangar upload."
            exit 0
          fi
          api=https://hangar.papermc.io/api/v1

          # Trade the API key for a short-lived JWT.
          token=$(curl -fsS -X POST --url-query "apiKey=$HANGAR_API_KEY" "$api/authenticate" | jq -er .token)
          echo "::add-mask::$token"

          # Reuse the GitHub release notes as the Hangar changelog.
          gh release view "v$VERSION" --json body --jq .body > notes.md

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$HANGAR_CHANNEL" \
            --rawfile description notes.md \
            --argjson paper "$PAPER_VERSIONS" \
            '{
              version: $version,
              channel: $channel,
              description: $description,
              platformDependencies: {PAPER: $paper},
              pluginDependencies: {PAPER: []},
              files: [{platforms: ["PAPER"]}]
            }' > versionUpload.json

          curl -fsS -X POST "$api/projects/$HANGAR_PROJECT/upload" \
            -H "Authorization: HangarAuth $token" \
            -F "versionUpload=<versionUpload.json;type=application/json" \
            -F "files=@target/Fhulkers-$VERSION.jar;type=application/java-archive" \
            | jq -r '"Published to Hangar: " + .url'
